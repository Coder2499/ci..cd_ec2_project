name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Choose environment to destroy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
          - prod
          - all

jobs:
  destroy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # This is required for OIDC token generation

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ✅ AWS Credentials via OIDC (No Secrets Required!)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::502580451784:role/github-actions-role
          role-session-name: github-actions-session
          aws-region: ap-south-1

      - name: Terraform Init
        run: terraform init

      - name: Destroy Selected Environment(s)
        run: |
          if [ "${{ github.event.inputs.environment }}" == "all" ]; then
            ENVS="dev qa prod"
          else
            ENVS="${{ github.event.inputs.environment }}"
          fi

          for ENV in $ENVS; do
            echo "=============================="
            echo "Destroying environment: $ENV"
            echo "=============================="

            terraform workspace select $ENV || {
              echo "Workspace $ENV not found, skipping..."
              continue
            }

            terraform destroy -auto-approve \
              -var="environment=$ENV"
          done