name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Choose environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
          - prod
      base_name:
        description: "Base server name"
        required: true
        default: "my-server"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # This is required for OIDC token generation

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ✅ AWS Credentials via OIDC (No Secrets Required!)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::502580451784:role/github-actions-role
          role-session-name: github-actions-session
          aws-region: ap-south-1

      - name: Terraform Init
        run: terraform init

      - name: Select/Create Workspace
        run: |
          terraform workspace select ${{ github.event.inputs.environment }} \
          || terraform workspace new ${{ github.event.inputs.environment }}

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
          -var="environment=${{ github.event.inputs.environment }}" \
          -var="base_name=${{ github.event.inputs.base_name }}"